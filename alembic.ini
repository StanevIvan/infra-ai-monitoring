# Alembic configuration.
#
# SECURITY: there is deliberately no `sqlalchemy.url` here. This file is
# committed to git, so a real DSN would leak credentials. The URL is resolved
# at runtime in migrations/env.py from DATABASE_URL (loaded from the
# gitignored .env), keeping .env the single secret store.
#
# Usage:
#   alembic upgrade head        apply all migrations
#   alembic downgrade -1        roll back one migration
#   alembic current             show the applied revision
#   alembic history             list revisions
#   alembic upgrade head --sql  print the SQL without connecting

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamped, readable revision filenames instead of bare hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
