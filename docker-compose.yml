# Local PostgreSQL for the Infrastructure AI Monitoring Platform (Phase C).
#
#   docker compose up -d        start Postgres in the background
#   docker compose ps           check health
#   docker compose logs -f db   follow logs
#   docker compose down         stop (data survives in the named volume)
#   docker compose down -v      stop AND delete all data
#
# Credentials come from .env, which Compose reads automatically from this
# directory. .env is gitignored, so no secret is ever committed. The `:?`
# syntax below makes Compose fail fast with a clear message if a required
# variable is missing, rather than silently starting with a blank password.
#
# Note: the top-level `version:` key is obsolete in modern Compose and is
# deliberately omitted.

services:
  db:
    image: postgres:16-alpine
    container_name: infra-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - add it to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - add it to .env}
      POSTGRES_DB: ${POSTGRES_DB:-infra}
      # Deterministic collation/encoding so behaviour matches CI and cloud.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    ports:
      # Host port is configurable: 5432 may already be taken by a local
      # Postgres install, which is a common and confusing first failure.
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Named volume, not a bind mount: data survives `down`, stays off the
      # OneDrive-synced working tree, and avoids Windows filesystem
      # permission problems with the postgres data directory.
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      # Compose (and, later, the app/migration services) can wait for
      # `service_healthy` instead of racing a database that is still starting.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: infra_pgdata
