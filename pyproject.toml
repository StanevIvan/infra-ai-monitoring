[project]
name = "infra-monitor"
version = "0.1.0"
description = "Infrastructure AI Monitoring Platform - metrics collection, storage, and (later) anomaly detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
]

[project.scripts]
infra-monitor = "infra_monitor.cli:main"

[project.optional-dependencies]
# PostgreSQL support is optional: the SQLite path must not require a
# Postgres driver, which is why factory.py imports psycopg lazily.
# psycopg[binary] bundles libpq, so no system PostgreSQL install is needed.
postgres = [
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Linters and the type checker are PINNED, not floated. A new ruff or
    # black release can add rules or change formatting, which would turn CI
    # red with no code change and disagree with what developers run locally.
    # Bump these deliberately, as a reviewed commit.
    "ruff==0.15.20",
    "black==26.5.1",
    "mypy==1.20.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The rule set is declared EXPLICITLY rather than inheriting ruff's defaults.
# Those defaults differ between releases, so an unpinned CI runner selected
# rules (S110, BLE001, SIM117) that never fired locally - the lint job went
# red with no code change. Naming the rules makes the check reproducible
# wherever it runs, and expanding it becomes a deliberate, reviewed decision.
#   E4/E7/E9 - pycodestyle errors        F   - pyflakes
#   I        - import sorting            B   - bugbear (likely bugs)
#   SIM      - simplifications
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
# Start pragmatic: catch real type errors without demanding annotations
# everywhere. Tighten (disallow_untyped_defs, strict) once CI is green.
ignore_missing_imports = true
warn_redundant_casts = true
# NOT warn_unused_ignores: psycopg is an optional dependency, so the
# `type: ignore` on its fallback import is needed when psycopg is installed
# and looks unused when it is not. The flag would flip between environments.
